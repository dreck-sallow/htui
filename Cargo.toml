[package]
name = "htui"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.88"
clap = { version = "4.5.13", features = ["derive"] }
crossterm = { version = "0.28.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.31"
ratatui = "0.29.0"
reqwest = "0.12.18"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
tui-textarea = "0.7.0"
tui-tree-widget = "0.23.1"
